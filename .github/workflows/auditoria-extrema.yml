name: "Auditoría de Seguridad Extrema (Defensa Civil)"

on:
  workflow_dispatch: # Permite ejecutar el análisis manualmente con un botón

jobs:
  security-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código (Historia completa para Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Instalar y Ejecutar Herramientas de Auditoría
        run: |
          echo "# AUDITORÍA DEFENSA CIVIL - NURSEHEALTH.AI v0.6.0" > AUDITORIA_DEFENSA_CIVIL.md
          
          echo -e "\n## 1. Test de Concurrencia y Condiciones de Carrera" >> AUDITORIA_DEFENSA_CIVIL.md
          echo '```text' >> AUDITORIA_DEFENSA_CIVIL.md
          GOTOOLCHAIN=local CGO_ENABLED=1 go test -v -race ./... >> AUDITORIA_DEFENSA_CIVIL.md 2>&1 || true
          echo '```' >> AUDITORIA_DEFENSA_CIVIL.md

          echo -e "\n## 2. Vulnerabilidades Conocidas en Go (govulncheck)" >> AUDITORIA_DEFENSA_CIVIL.md
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo '```text' >> AUDITORIA_DEFENSA_CIVIL.md
          govulncheck ./... >> AUDITORIA_DEFENSA_CIVIL.md 2>&1 || true
          echo '```' >> AUDITORIA_DEFENSA_CIVIL.md

          echo -e "\n## 3. Análisis Estático Profundo (gosec)" >> AUDITORIA_DEFENSA_CIVIL.md
          curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.18.2
          echo '```text' >> AUDITORIA_DEFENSA_CIVIL.md
          $(go env GOPATH)/bin/gosec -fmt=text ./... >> AUDITORIA_DEFENSA_CIVIL.md 2>&1 || true
          echo '```' >> AUDITORIA_DEFENSA_CIVIL.md

          echo -e "\n## 4. Auditoría de Secretos (Gitleaks)" >> AUDITORIA_DEFENSA_CIVIL.md
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          echo '```text' >> AUDITORIA_DEFENSA_CIVIL.md
          gitleaks detect --source . -v >> AUDITORIA_DEFENSA_CIVIL.md 2>&1 || true
          echo '```' >> AUDITORIA_DEFENSA_CIVIL.md

      - name: Guardar Reporte como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: reporte-auditoria-defensa-civil
          path: AUDITORIA_DEFENSA_CIVIL.md
